name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skip runs queued between the run in-progress and latest queued
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies with fallback
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found. Attempting npm ci..."
            npm ci || {
              echo "npm ci failed or had conflicts. Falling back to npm install..."
              npm install --legacy-peer-deps || npm install
            }
          else
            echo "No package-lock.json found. Running npm install..."
            npm install --legacy-peer-deps || npm install
          fi

      - name: Build project
        run: |
          npm run build
          # Disable Jekyll processing on GitHub Pages
          touch dist/.nojekyll
          # Ensure SPA fallback for direct routing and reloads
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

